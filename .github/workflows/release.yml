name: Release dictionary

on:
  push:
    branches: [main]
    paths:
      - 'epv-thayer-kjv_*.dct.zip'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for the newest dictionary file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls epv-thayer-kjv_*.dct.zip | sort | tail -n 1)
          TAG=$(echo "$FILE" | sed -E 's/^epv-thayer-kjv_(.*)\.dct\.zip$/\1/')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          gh release create "$TAG" "$FILE" \
            --title "Greek-Bible-Lexicon_$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
